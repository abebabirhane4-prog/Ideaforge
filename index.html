<!DOCTYPE html>
<html>
<head>
    <title>IdeaForge</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 85%;
            max-width: 700px;
            padding: 60px 40px;
            text-align: center;
            background: #111111;
            border: 1px solid #444;
            border-radius: 25px;
            box-shadow: 0 0 60px rgba(255,255,255,0.08);
        }

        h1 {
            font-size: 55px;
            letter-spacing: 8px;
            margin-bottom: 15px;
        }

        p {
            color: #999;
            font-size: 18px;
            margin-bottom: 35px;
        }

        input {
            width: 80%;
            padding: 17px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #181818;
            color: white;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 16px 28px;
            border: none;
            border-radius: 12px;
            background: white;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            background: #181818;
            border-radius: 12px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="app">

        <h1>IDEA FORGE</h1>

        <p>Turn your thoughts into something real.</p>
<select id="category">
    <option value="random">🚀 Random</option>
    <option value="business">💼 Business</option>
    <option value="app">📱 App</option>
    <option value="school">🎓 School</option>
    <option value="money">💰 Money</option>
</select>
        <input id="ideaInput"
               type="text"
               placeholder="What are you creating today?">

        <br>

        <button onclick="createIdea()">
            CREATE MY IDEA 🚀
        </button>

        <div id="result"></div>

    </div>

    <script>
       function createIdea() {

    const category = document.getElementById("category").value;
    const result = document.getElementById("result");

    if (category === "business") {

        result.innerText =
            "💼 Business idea: Create a platform that helps small businesses find customers.";

    } else if (category === "app") {

        result.innerText =
            "📱 App idea: Create an app that turns everyday problems into simple solutions.";

    } else if (category === "school") {

        result.innerText =
            "🎓 School idea: Create a smart study app that turns lessons into challenges.";

    } else if (category === "money") {

        result.innerText =
            "💰 Money idea: Create a marketplace where people can sell digital products.";

    } else {

        result.innerText =
            "🚀 Random idea: Create something that solves a problem people face every day.";
    }
}

            const question =
                document.getElementById("ideaInput").value.toLowerCase();

            const result =
                document.getElementById("result");

            if (question.trim() === "") {
                result.innerText =
                    "💡 Tell me what kind of idea you want.";
            }

            else if (question.includes("business")) {
                result.innerText =
                    "💼 Business idea: Build a platform that helps small businesses.";
            }

            else if (question.includes("app")) {
                result.innerText =
                    "📱 App idea: Create an app that solves an everyday problem.";
            }

            else if (question.includes("school") ||
                     question.includes("student")) {
                result.innerText =
                    "🎓 School idea: Create a smart study app.";
            }

            else if (question.includes("money")) {
                result.innerText =
                    "💰 Money idea: Build a marketplace for digital products.";
            }

            else {
                result.innerText =
                    "🚀 Creative idea: Turn an everyday problem into an invention.";
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>IdeaForge</title>
</head>

<body>

    <h1>IDEA FORGE</h1>

    <p>Turn your thoughts into something real.</p>

    <input id="ideaInput" type="text" placeholder="What are you creating today?">

    <button onclick="createIdea()">CREATE MY IDEA</button>

    <h2 id="result"></h2>

    <script>
        function createIdea() {
            const question = document.getElementById("ideaInput").value.toLowerCase();
            const result = document.getElementById("result");

            if (question.includes("business")) {
                result.innerText = "Business idea: Create a platform that helps small businesses.";
            } else if (question.includes("app")) {
                result.innerText = "App idea: Create an app that solves an everyday problem.";
            } else if (question.includes("school")) {
                result.innerText = "School idea: Create an app that makes studying easier.";
            } else {
                result.innerText = "Creative idea: Build something that solves a problem you see every day.";
            }
        }
    </script>

</body>
</html>

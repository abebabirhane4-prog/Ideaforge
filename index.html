<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdeaForge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <h1>IDEA FORGE</h1>

        <p>Turn your thoughts into something real.</p>

        <select id="category">
            <option value="random">🚀 Random</option>
            <option value="business">💼 Business</option>
            <option value="app">📱 App</option>
            <option value="school">🎓 School</option>
            <option value="money">💰 Money</option>
        </select>

        <input
            id="ideaInput"
            type="text"
            placeholder="What are you creating today?"
        >

        <button onclick="createIdea()">CREATE MY IDEA 🚀</button>
<button onclick="createIdea()">🔄 GENERATE ANOTHER</button>
        <div id="result"></div>
<button onclick="saveIdea()">❤️ SAVE IDEA</button>
    </main>
    <h2>📂 SAVED IDEAS</h2>

<div id="savedIdeas"></div>

    <script src="script.js"></script>

</body>
</html>

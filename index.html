<!DOCTYPE html>
<html>
<head>
    <title>IdeaForge</title>

    <style>
        body {
            margin: 0;
            background: #0b0714;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .app {
            padding-top: 120px;
        }

        h1 {
            font-size: 50px;
            letter-spacing: 6px;
        }

        p {
            color: #b9a7d9;
        }

        input {
            width: 320px;
            padding: 16px;
            border-radius: 12px;
            border: none;
            margin: 25px 10px;
            font-size: 16px;
        }

        button {
            padding: 16px 28px;
            border: none;
            border-radius: 12px;
            background: #8b5cf6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #a78bfa;
        }

        #result {
            margin-top: 35px;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <div class="app">

        <h1>IDEA FORGE</h1>

        <p>Turn your thoughts into something real.</p>

        <input
            id="ideaInput"
            type="text"
            placeholder="What are you creating today?"
        >

        <br>

        <button onclick="createIdea()">
            CREATE MY IDEA 🚀
        </button>

        <h2 id="result"></h2>

    </div>

    <script>
        function createIdea() {

            const question =
                document.getElementById("ideaInput").value.toLowerCase();

            const result =
                document.getElementById("result");

            if (question.trim() === "") {

                result.innerText =
                    "💡 Tell me what kind of idea you want.";

            } else if (question.includes("business")) {

                result.innerText =
                    "💼 Business idea: Create a platform that helps small businesses manage customers and orders.";

            } else if (question.includes("app")) {

                result.innerText =
                    "📱 App idea: Create an app that turns everyday problems into practical solutions.";

            } else if (
                question.includes("school") ||
                question.includes("student")
            ) {

                result.innerText =
                    "🎓 School idea: Create a study app that turns difficult lessons into challenges.";

            } else if (question.includes("money")) {

                result.innerText =
                    "💰 Money idea: Create a digital marketplace where creators can sell useful products.";

            } else {

                result.innerText =
                    "🚀 Creative idea: Build a platform where people turn everyday problems into new inventions.";
            }
        }
    </script>

</body>
</html>
